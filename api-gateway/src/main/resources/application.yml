server:
  port: 8080

spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: orders
              uri: ${ORDER_SERVICE_URI:http://order-service:8081}
              predicates:
                - Path=/api/orders/**
            - id: stock
              uri: ${INVENTORY_SERVICE_URI:http://inventory-service:8082}
              predicates:
                - Path=/api/stock/**
            - id: payments
              uri: ${PAYMENT_SERVICE_URI:http://payment-service:8083}
              predicates:
                - Path=/api/payments/**
            - id: graphql
              uri: ${QUERY_SERVICE_URI:http://query-service:8084}
              predicates:
                - Path=/graphql
            - id: graphiql
              uri: ${QUERY_SERVICE_URI:http://query-service:8084}
              predicates:
                - Path=/graphiql/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [correlationId=%X{correlationId:-}] [%thread] %logger{40} - %msg%n"
