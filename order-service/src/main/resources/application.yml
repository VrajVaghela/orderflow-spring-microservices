server:
  port: 8081

spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://postgres:5432/orders}
    username: ${POSTGRES_USER:orderflow}
    password: ${POSTGRES_PASSWORD:orderflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration/order
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      concurrency: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [correlationId=%X{correlationId:-}] [%thread] %logger{40} - %msg%n"

orderflow:
  inventory:
    host: ${INVENTORY_HOST:inventory-service}
    port: ${INVENTORY_GRPC_PORT:9090}
    deadline: 2s
  outbox:
    poll-interval-ms: 400
    batch-size: 100
    max-attempts: 10
  saga:
    recovery-interval-ms: 2000
    placed-grace-ms: 3000
    payment-timeout-ms: 600000

resilience4j:
  circuitbreaker:
    instances:
      inventory:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - io.grpc.StatusRuntimeException
          - com.orderflow.order.infrastructure.grpc.InventoryCallFailedException
  retry:
    instances:
      inventory:
        max-attempts: 3
        wait-duration: 150ms
        retry-exceptions:
          - io.grpc.StatusRuntimeException
          - com.orderflow.order.infrastructure.grpc.InventoryCallFailedException
  timelimiter:
    instances:
      inventory:
        timeout-duration: 2s
        cancel-running-future: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
