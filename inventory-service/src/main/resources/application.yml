server:
  port: 8082

spring:
  application:
    name: inventory-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://postgres:5432/inventory}
    username: ${POSTGRES_USER:orderflow}
    password: ${POSTGRES_PASSWORD:orderflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration/inventory

grpc:
  server:
    port: ${INVENTORY_GRPC_PORT:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [correlationId=%X{correlationId:-}] [%thread] %logger{40} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
